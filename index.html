<body>
<style>

  :root{
    --paper:      #ffffff;
    --paper-2:    #faf8f5;
    --paper-3:    #f1ece3;
    --ink:        #17130f;
    --ink-2:      #55493a;
    --ink-3:      #948877;
    --line:       #e7e0d3;
    --line-strong:#cdc0a6;
    --shadow:     rgba(23,19,15,.10);
    --focus:      #17130f;
    --radius-s: 14px;
    --radius-m: 22px;
    --radius-l: 32px;
    --font-display: 'Baloo 2', system-ui, sans-serif;
    --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
    --ease-bounce: cubic-bezier(.34,1.56,.64,1);
  }
  *{ box-sizing:border-box; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); }
  #app{ max-width:720px; margin:0 auto; padding:24px 20px 64px; min-height:100vh; opacity:0; transform:translateY(10px) scale(.99); }
  #app.fade-in{ animation:appIn .42s var(--ease-bounce) forwards; }
  #app.ready{ opacity:1; transform:none; }
  @keyframes appIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @media (prefers-reduced-motion: reduce){
    #app{ opacity:1; transform:none; }
    #app.fade-in{ animation:none; }
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
  #app.wide{ max-width:1160px; }
  h1,h2,h3{ margin:0; font-weight:700; font-family:var(--font-display); }
  p{ margin:0; }
  a{ color:inherit; }
  .hidden{ display:none !important; }

  .tagline{ font-size:15px; color:var(--ink-2); }
  .mono{ font-variant-numeric:tabular-nums; }
  .stack{ display:flex; flex-direction:column; gap:16px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .row.wrap{ flex-wrap:wrap; }
  .grow{ flex:1; min-width:0; }
  .center{ text-align:center; }
  .top-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; }
  .top-nav .brand{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .brand-logo{ height:36px; width:auto; display:block; }
  #app.fade-in .brand-logo{ animation:lhBootPop .5s var(--ease-bounce) both; }
  @media (prefers-reduced-motion:reduce){
    #app.fade-in .brand-logo{ animation:none; }
  }
  .hero-logo{ max-width:300px; width:78%; margin:0 auto 18px; display:block; }
  .landing-stack{ margin-top:7vh; gap:30px; }
  .landing-hero{ margin-bottom:2px; }
  .landing-tagline{ max-width:23ch; margin:0 auto; line-height:1.5; }
  .hero-badge{ width:104px; margin:14px auto 0; display:block; border-radius:14px; }

  .staff-bar{ background:var(--ink); margin:-24px -20px 24px; padding:18px 20px; border-radius:0 0 28px 28px; }
  .staff-bar .btn{ border-color:var(--paper); color:var(--paper); }
  .staff-bar .brand-logo{ height:30px; }

  .timing-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .timing-row:last-child{ border-bottom:none; }
  .timing-row .timing-input{ width:78px; flex:0 0 auto; font-size:14px; padding:8px 10px; }

  /* ---------------------------- small-screen tightening ---------------------------- */
  @media (max-width:380px){
    #app{ padding:18px 14px 56px; }
    .ticket{ padding:18px; }
    .cols{ grid-template-columns:1fr; }
    .stat-row{ gap:8px; }
    .modal-card{ padding:18px; }
  }

  /* ---------------------------- boot splash ---------------------------- */
  #lh-boot{
    position:fixed; inset:0; z-index:80; background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity .4s ease, visibility .4s ease;
  }
  #lh-boot.gone{ opacity:0; visibility:hidden; }
  .lh-boot-logo{ width:min(52vw,210px); height:auto; animation:lhBootPop .5s var(--ease-bounce) both; }
  .lh-boot-steam{ display:flex; gap:7px; height:26px; align-items:flex-end; }
  .lh-boot-steam span{
    width:7px; height:7px; border-radius:50%; background:var(--ink);
    animation:lhSteam 1.25s ease-in-out infinite;
  }
  .lh-boot-steam span:nth-child(2){ animation-delay:.16s; }
  .lh-boot-steam span:nth-child(3){ animation-delay:.32s; }
  .lh-boot-word{
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.16em;
    color:var(--ink-3);
  }
  @keyframes lhBootPop{ from{ transform:scale(.88); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes lhSteam{
    0%,100%{ transform:translateY(0) scale(1); opacity:.35; }
    50%{ transform:translateY(-11px) scale(1.25); opacity:1; }
  }
  @media (prefers-reduced-motion:reduce){
    .lh-boot-logo,.lh-boot-steam span{ animation:none; }
  }


</style>

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  // Registers this device for real push notifications against one order, so the
  // alert still lands when the browser is fully closed. iOS only allows this
  // from an app added to the Home Screen; Android Chrome allows it from a tab.
  async function subscribeToPush(orderId){
    if (!pushSupported() || !orderId) return false;
    try{
      const reg = await ensureServiceWorker();
      if (!reg) return false;
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)

      const json = JSON.parse(JSON.stringify(sub));
      if (sb){
        await sb.from('push_subscriptions')
          .upsert({ order_id: orderId, endpoint: json.endpoint, subscription: json },

  /* ---------------------------- queue math ---------------------------- */
  function activeQueue(){
    return orders.filter(o=>o.status==='received'||o.status==='preparing').sort((a,b)=>a.createdAt-b.createdAt);
  }
  function aheadCount(order){
    return activeQueue().filter(o=>o.id!==order.id && o.createdAt < order.createdAt).length;
  }
  // One fixed target time is set the moment an order is placed (see placeOrder)
  // and never recalculated — the customer sees a single countdown running
  // from "order placed" all the way to "delivered", instead of the timer
  // resetting/re-estimating at every status change. orderEtaAt() is only a
  // fallback for orders placed before eta_at existed on the orders table.
  function orderEtaAt(order){
    if (order.etaAt) return order.etaAt;
    const deliveryMins = deliveryMinutesFor(order.dropOff);
    if (order.status === 'received'){
      const aheadMinutes = activeQueue().filter(o=>o.id!==order.id && o.createdAt<order.createdAt).reduce((s,o)=>s+(o.prepMinutes||0),0);
      return order.createdAt + (aheadMinutes + order.prepMinutes + deliveryMins)*60000;
    }
    if (order.status === 'preparing'){
      const start = order.preparingStartedAt || order.createdAt;
      return start + (order.prepMinutes + deliveryMins)*60000;
    }
    if (order.status === 'ready'){
      return (order.readyAt || Date.now()) + deliveryMins*60000;
    }
    if (order.status === 'delivering'){
      return (order.deliveringAt || Date.now()) + deliveryMins*60000;
    }
    return Date.now();
  }
  function etaInfo(order){
    if (order.status==='delivered' || order.status==='cancelled') return { ahead:0, ms:0, mode:'done' };
    const ahead = order.status==='received' ? aheadCount(order) : 0;
    const ms = orderEtaAt(order) - Date.now();
    if (ms > 0) return { ahead, ms, mode:'countdown' };
    return { ahead, ms: Math.abs(ms), mode:'late' };
  }
  function timerBlock(order, info){
    info = info || etaInfo(order);
    switch(info.mode){
      case 'countdown': return { big: formatCountdown(info.ms), caption:'until delivered' };
      case 'late':       return { big: 'Running late', caption: formatCountdown(info.ms)+' over estimate' };
      default:           return { big:'Delivered', caption:'enjoy!' };
    }
  }

  function genVerifyCode(){
    // Fixed pattern: number, number, letter, letter, number, letter — e.g. "48KP3M".
    // Digits skip 0/1 and letters skip I/O so it's never ambiguous read aloud or on a smudged screen.
    const digits = '23456789';
    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const pick = set => set[Math.floor(Math.random()*set.length)];
    return pick(digits) + pick(digits) + pick(letters) + pick(letters) + pick(digits) + pick(letters);
  }
  async function placeOrder(){
    if (!state.cart.length || !state.dropOff) return;
    if (settings.shopOpen===false && !state.staff){ toast('Sorry, we\'re not taking orders today.'); render(); return; }
    const items = state.cart.map(i=>({id:i.id, name:i.name, price:i.price, qty:i.qty, baseId:i.baseId||i.id, toppings:i.toppings||[]}));
    const total = items.reduce((s,i)=>s+i.price*i.qty,0);
    const prepMinutes = calcPrepMinutes(items);
    if (total < 1){
      toast('Card payments need a £1 minimum — please have cash ready to pay at the counter.');
    }
    const comment = (state.orderComment||'').trim().slice(0,200);
    // One fixed ETA computed once, right now, from: how much prep is already
    // queued ahead of this order + this order's own prep time + the walk to
    // the drop-off point. This is the single number the whole countdown is
    // built on — it never gets recalculated as the order moves through
    // received -> preparing -> ready -> delivering.
    const aheadMinutes = orders.filter(o=>o.status==='received'||o.status==='preparing').reduce((s,o)=>s+(o.prepMinutes||0),0);
    const deliveryMins = deliveryMinutesFor(state.dropOff);
    const etaAt = new Date(Date.now() + (aheadMinutes+prepMinutes+deliveryMins)*60000).toISOString();
    const { data, error } = await sb.from('orders').insert({
      drop_off: state.dropOff, items, total, status:'received', prep_minutes: prepMinutes, verify_code: genVerifyCode(),
      comment: comment || null, eta_at: etaAt
    }).select().single();
    if (error){ toast('Could not place order — try again.'); console.error(error); return; }
    upsertOrderLocal(data);
    prevStatusMap.set(data.id, 'received');
    addTrackedOrderId(data.id);
    state.myOrderId = data.id;
    state.cart = [];
    state.orderComment = '';
    go('status');
  }

  function cartQty(id){ const line = state.cart.find(i=>i.id===id); return line ? line.qty : 0; }
  function addToCart(item){
    const line = state.cart.find(i=>i.id===item.id);
    if (line) line.qty++; else state.cart.push({ id:item.id, name:item.name, price:item.price, qty:1, baseId:item.id, toppings:[] });
    render();
  }
  // Tapping a topping chip adds that topping onto an existing unit of the base
  // item (e.g. Crumpet -> +Jam -> +Marmalade builds ONE "Crumpet + Jam + Marmalade"
  // line) instead of spawning a brand new separate combo line every tap.
  function addToppingToCart(base, topping){
    const idx = state.cart.findIndex(l => l.baseId===base.id && !(l.toppings||[]).includes(topping));
    if (idx===-1){
      toast('Add a '+base.name+' first, then tap a topping to add it.');
      return false;
    }
    const tPrice = base.toppingPrice!=null ? base.toppingPrice : 0.5;
    const existing = state.cart[idx];
    existing.qty--;
    const newToppings = [...(existing.toppings||[]), topping].sort();
    if (existing.qty<=0) state.cart.splice(idx,1);
    const newId = base.id+'::'+newToppings.join('+');
    const newLine = state.cart.find(l=>l.id===newId);
    if (newLine){ newLine.qty++; }
    else {
      state.cart.push({
        id:newId, baseId:base.id, name:base.name+' + '+newToppings.join(' + '),
        price: base.price + newToppings.length*tPrice, qty:1, toppings:newToppings
      });
    }
    render();
    return true;
  }
  function removeFromCart(id){
    const line = state.cart.find(i=>i.id===id);
    if (!line) return;
    line.qty--;
    if (line.qty<=0) state.cart = state.cart.filter(i=>i.id!==id);
    render();
  }
  function cartTotal(){ return state.cart.reduce((s,i)=>s+i.price*i.qty,0); }
  function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0); }

  async function moveMenuItem(id, dir){
    const item = menuItems.find(m=>m.id===id);
    if (!item) return;
    const siblings = menuItems.filter(m=>m.category===item.category).sort((a,b)=>a.sort-b.sort);
    const idx = siblings.findIndex(m=>m.id===id);
    const swapIdx = dir==='up' ? idx-1 : idx+1;
    if (swapIdx<0 || swapIdx>=siblings.length) return;
    const other = siblings[swapIdx];
    const mySort = item.sort, otherSort = other.sort;
    item.sort = otherSort; other.sort = mySort;
    menuItems.sort((a,b)=>a.sort-b.sort);
    render();
    await Promise.all([
      sb.from('menu_items').update({ sort: item.sort }).eq('id', item.id),
      sb.from('menu_items').update({ sort: other.sort }).eq('id', other.id)
    ]);
  }

  // Shared stepper renderer for BOTH the ordering flow (Point/Menu/Basket) and
  // the customer order-tracking stepper (Placed/Preparing/Ready/Out for
  // delivery/Delivered). Each is rendered with its PREVIOUS known step's
  // classes first — render() flips every '.stepper[id]' to its real target a
  // frame later so persistent-feeling CSS transitions can play (sliding
  // forward/back between real step changes) instead of the whole row popping
  // in from scratch or replaying on every re-render.
  function stepperHtml(id, labels, targetStep){
    const insertStep = stepperLastStep[id] != null ? stepperLastStep[id] : -1;
    return '<div class="stepper" id="'+id+'" data-target-step="'+targetStep+'">' + labels.map((label,i)=>{
      const cls = i < insertStep ? 'done' : (i===insertStep ? 'active' : '');
      return '<div class="step '+cls+'" data-idx="'+i+'"><div class="bar"></div><div class="dot">'+(i+1)+'</div><div class="label">'+label+'</div></div>';
    }).join('') + '</div>';
  }

    return stepperHtml('ordering-stepper', ['Point','Menu','Basket'], step);

      order.deliveringAt && {label:'Out for delivery', ts:order.deliveringAt},

      ? '<div class="center tagline" style="margin-top:-8px;margin-bottom:10px;">Being brought to you by <strong>'+escapeHtml(order.courierName)+'</strong></div>' : '';

      ? '<p class="tagline center" style="margin-top:8px;font-size:12px;">On iPhone, tap Share → Add to Home Screen first, then open it from there to get alerts with Safari closed.</p>'

      '<div class="ticket">' +

        waitStepper(order.status) +

        '<div class="stat-row">' +
          '<div class="stat-tile"><div class="num">'+ (order.status==='received' ? info.ahead : 0) +'</div><div class="label">Ahead of you</div></div>' +

        '</div>' +
        '<div class="ticket-perf"></div>' +
        statusTimeline(order) +

        '<div class="stack" style="gap:8px;">' + order.items.map(i=>

        (order.comment ? '<div class="ticket-perf"></div><div class="order-note"><span class="order-note-label">Your note</span>'+escapeHtml(order.comment)+'</div>' : '') +
        '<div class="ticket-perf"></div>' +
        '<div class="row between"><strong>Total</strong><strong class="mono">'+money(order.total)+'</strong></div>' +
      '</div>' +

  function orderTicketMini(order, actions){
    const itemsText = order.items.map(i=>i.qty+'× '+escapeHtml(i.name)).join(', ');
    const itemCount = order.items.reduce((s,i)=>s+i.qty,0);
    const isLong = itemsText.length > 70 || order.items.length > 4 || (order.comment && order.comment.length > 60);
    const hasTimer = ['received','preparing','ready','delivering'].includes(order.status);
    const timerInfo = hasTimer ? etaInfo(order) : null;
    const deliverTimer = hasTimer
      ? '<span class="chip filled deliver-timer'+(timerInfo.mode==='late'?' late':'')+'" id="dtimer-'+order.id+'">'+timerBlock(order, timerInfo).big+'</span>'
      : '';
    return '<div class="ticket-mini" data-action="view-order" data-id="'+order.id+'">' +
      '<div class="row between wrap" style="row-gap:6px;"><span class="order-num">#'+order.number+'</span><span class="row wrap" style="gap:6px;row-gap:6px;">'+
        '<span class="chip">Point '+order.dropOff+'</span>'+(order.verifyCode?'<span class="verify-chip">'+order.verifyCode+'</span>':'')+deliverTimer+
      '</span></div>' +
      '<div class="order-meta">'+itemCount+' item'+(itemCount>1?'s':'')+' · '+money(order.total)+' · <span class="waited">'+timeSince(order.createdAt)+'</span></div>' +
      '<div class="order-items'+(isLong?' clamped':'')+'">' + itemsText + '</div>' +
      (order.comment ? '<div class="order-note-badge'+(isLong?' clamped':'')+'">📝 '+escapeHtml(order.comment)+'</div>' : '') +
      (isLong ? '<div class="ticket-more-hint">··· tap for full order</div>' : '') +
      (actions||'') +
    '</div>';
  }

  function renderCafeSection(){
    const received = orders.filter(o=>o.status==='received').sort((a,b)=>a.createdAt-b.createdAt);
    const preparing = orders.filter(o=>o.status==='preparing').sort((a,b)=>a.createdAt-b.createdAt);
    const ready = orders.filter(o=>o.status==='ready').sort((a,b)=>a.createdAt-b.createdAt);
    return '<div class="dash-header"><h2>Cafe</h2><span class="chip filled">'+(received.length+preparing.length)+' in queue</span></div>' +
      '<div class="cols">' +
        '<div class="col"><div class="col-head"><h3>New</h3><span class="chip">'+received.length+'</span></div><div class="stack">' +
          (received.length ? received.map(o=>orderTicketMini(o, '<button class="btn btn-sm btn-block" style="margin-top:10px;" data-action="advance" data-id="'+o.id+'" data-to="preparing">Start preparing</button>')).join('') : '<div class="empty-note">No new orders</div>') +
        '</div></div>' +
        '<div class="col"><div class="col-head"><h3>Preparing</h3><span class="chip">'+preparing.length+'</span></div><div class="stack">' +
          (preparing.length ? preparing.map(o=>orderTicketMini(o, '<button class="btn btn-sm btn-block" style="margin-top:10px;" data-action="advance" data-id="'+o.id+'" data-to="ready">Mark ready</button>')).join('') : '<div class="empty-note">Nothing on the go</div>') +
        '</div></div>' +
        '<div class="col"><div class="col-head"><h3>Ready for delivery</h3><span class="chip">'+ready.length+'</span></div><div class="stack">' +
          (ready.length ? ready.map(o=>orderTicketMini(o)).join('') : '<div class="empty-note">Nothing waiting</div>') +
        '</div></div>' +
      '</div>';

  function renderDeliverySection(){
    const ready = orders.filter(o=>o.status==='ready');

    const pool = [...ready, ...delivering].sort((a,b)=>a.createdAt-b.createdAt);
    const filtered = state.deliveryFilter && state.deliveryFilter!=='all' ? pool.filter(o=>String(o.dropOff)===String(state.deliveryFilter)) : pool;
    const pts = []; for (let n=DROP_MIN;n<=DROP_MAX;n++) pts.push(n);
    return '<div class="dash-header" style="margin-top:28px;"><h2>Delivery</h2><span class="chip filled">'+ready.length+' ready</span></div>' +
      '<div class="dropoff-tabs">' +
        '<div class="cat-tab '+(!state.deliveryFilter||state.deliveryFilter==='all'?'active':'')+'" data-action="set-delivery-filter" data-f="all">All points</div>' +
        pts.map(n=>'<div class="cat-tab '+(String(state.deliveryFilter)===String(n)?'active':'')+'" data-action="set-delivery-filter" data-f="'+n+'">Point '+n+'</div>').join('') +
      '</div>' +

        (filtered.length ? filtered.map(o=>{

  function renderTimingsPanel(){
    const cats = sortCategories([...new Set(menuItems.map(m=>m.category))]);
    const pts = []; for (let n=DROP_MIN;n<=DROP_MAX;n++) pts.push(n);
    return '<details class="panel" data-key="timings"'+(state.panelsOpen.timings?' open':'')+'><summary>Timings</summary>' +
      '<p class="tagline" style="margin:4px 0 14px;">Set how long each item takes to prepare and how long delivery takes to each point — customers then see an accurate combined estimate on their order.</p>' +
      '<div class="menu-admin-cat">Prep time per item (min : sec)</div>' +
      cats.map(cat=>
        menuItems.filter(m=>m.category===cat).map(m=>{
          const secs = m.prepSeconds!=null ? m.prepSeconds : 90;
          const mm = Math.floor(secs/60), ss = secs%60;
          return '<div class="timing-row">' +
            '<span class="grow">'+escapeHtml(m.name)+'</span>' +
            '<span class="timing-msgroup">' +
              '<input type="number" min="0" max="20" class="timing-input" data-field="prep-min" data-id="'+m.id+'" value="'+mm+'">' +
              '<span class="timing-colon">:</span>' +
              '<input type="number" min="0" max="59" step="5" class="timing-input" data-field="prep-sec" data-id="'+m.id+'" value="'+ss+'">' +
            '</span>' +
          '</div>';
        }).join('')
      ).join('') +
      '<div class="menu-admin-cat" style="margin-top:18px;">Delivery time per drop-off point (min : sec)</div>' +
      pts.map(n=>{
        const totalSecs = Math.round(deliveryMinutesFor(n)*60);

        return '<div class="timing-row">' +
          '<span class="grow">Point '+n+'</span>' +
          '<span class="timing-msgroup">' +
            '<input type="number" min="0" max="30" class="timing-input" data-field="delivery-min" data-id="'+n+'" value="'+mm+'">' +
            '<span class="timing-colon">:</span>' +
            '<input type="number" min="0" max="59" step="5" class="timing-input" data-field="delivery-sec" data-id="'+n+'" value="'+ss+'">' +
          '</span>' +
        '</div>';

      '<div class="menu-admin-cat" style="margin-top:18px;">Admin buffer &amp; rounding</div>' +
      '<p class="tagline" style="margin-bottom:10px;">A small fixed buffer added to every order (for handoff, packaging, etc.), then the total is rounded up to keep the number on screen simple.</p>' +

        '</select>' +
      '</div>' +
      '<div class="pace-row">' +
        '<label for="topping-prep-input">Extra time per add-on (seconds)</label>' +
        '<input type="number" min="0" max="60" step="1" id="topping-prep-input" value="'+((settings&&settings.toppingPrepSeconds!=null)?settings.toppingPrepSeconds:5)+'">' +

          (s.is_admin?' <span class="chip">Admin</span>':'')+
        '</td>' +
        '<td><div class="switch '+(s.active?'on':'')+'" data-action="toggle-staff-active" data-id="'+s.id+'" data-current="'+s.active+'"><div class="knob"></div></div></td>' +
        '<td>'+action+'</td>' +
      '</tr>';
    }).join('');
    return '<details class="panel" data-key="team"'+(state.panelsOpen.team?' open':'')+'><summary>Team</summary>' +
      '<p class="tagline" style="margin:4px 0 12px;">PINs are one-way encrypted, so nobody — including us — can look up what someone\'s PIN already is. You can set a new one for a teammate here, or change your own below.</p>' +
      '<div class="team-table-wrap"><table class="team-table">' +
        '<thead><tr><th>Name</th><th>Active</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
      renderPinActionBox() +
      renderRenameBox() +
      addBox +
    '</details>';
  }

  function renderShopStatusBar(){
    const open = settings.shopOpen!==false;
    return '<div class="shop-status-bar '+(open?'open':'closed')+'">' +
      '<div><div class="shop-status-label">'+(open?'Serving today':'Closed today')+'</div>' +
      '<div class="tagline" style="color:inherit;opacity:.85;">'+(open?'Customers can place orders as normal.':'Customers see a closed message and can\u2019t place orders.')+'</div></div>' +
      '<div class="switch lg '+(open?'on':'')+'" data-action="toggle-shop-open" data-current="'+open+'"><div class="knob"></div></div>' +
    '</div>';
  }

  function renderStaffBoard(){
    document.getElementById('app') && document.getElementById('app').classList.add('wide');
    const notifBtn = window.Notification
      ? (Notification.permission==='granted'
          ? '<button class="btn btn-sm '+(state.staffAlertsOn?'chip filled':'')+'" data-action="enable-staff-notifs">'+(state.staffAlertsOn?'Alerts on (tap to mute)':'Alerts muted')+'</button>'
          : '<button class="btn btn-sm" data-action="enable-staff-notifs">Enable alerts</button>')
      : '';
    const modes = ['cafe','delivery','both'];
    return topNavStaff({right:'<button class="btn btn-sm" data-action="staff-signout">Sign out</button>'}) +
      '<div class="row between wrap" style="margin-bottom:6px;"><span class="tagline">Signed in as <strong>'+escapeHtml(state.staff.name)+'</strong></span>'+notifBtn+'</div>' +
      (state.staff.isAdmin ? renderShopStatusBar() : '') +
      '<div class="mode-switch">' + modes.map(m=>'<button class="mode-pill '+(state.staffMode===m?'active':'')+'" data-action="set-staff-mode" data-mode="'+m+'">'+cap(m)+'</button>').join('') + '</div>' +
      ((state.staffMode==='cafe'||state.staffMode==='both') ? renderCafeSection() : '') +
      ((state.staffMode==='delivery'||state.staffMode==='both') ? renderDeliverySection() : '') +
      (state.staff.isAdmin ? renderMenuPanel()+renderTimingsPanel()+renderTeamPanel() : '') +
      renderOrderModal();
  }

  /* ---------------------------- master render ---------------------------- */
  function render(navEntrance){
    const app = document.getElementById('app');
    app.classList.remove('wide');
    let html = '';
    const shopClosed = settings.shopOpen===false && !state.staff;
    if (connectError){ html = renderConnectError(); }
    else if (shopClosed && ['landing','dropoff','menu','basket'].includes(state.view)){ html = renderClosedScreen(); }
    else switch(state.view){
      case 'landing': html = renderLanding(); break;
      case 'dropoff': html = renderDropoff(); break;
      case 'menu': html = renderMenu(); break;
      case 'basket': html = renderBasket(); break;
      case 'status': html = renderStatus(); break;
      case 'staffLogin': html = renderStaffLogin(); break;
      case 'staffMode': html = renderStaffMode(); break;
      case 'staffBoard': html = renderStaffBoard(); break;
      default: html = renderLanding();
    }
    app.innerHTML = html;
    ['ordering-stepper','wait-stepper'].forEach(id=>{
      const stepperEl = document.getElementById(id);
      if (!stepperEl){ stepperLastStep[id] = -1; return; }
      const target = parseInt(stepperEl.dataset.targetStep, 10);
      requestAnimationFrame(()=>{
        stepperEl.querySelectorAll('.step').forEach(el=>{
          const i = parseInt(el.dataset.idx, 10);
          el.classList.remove('done','active');
          if (i < target) el.classList.add('done');
          else if (i === target) el.classList.add('active');
        });
      });
      stepperLastStep[id] = target;
    });
    if (navEntrance){
      app.classList.remove('ready');
      app.classList.remove('fade-in'); void app.offsetWidth; app.classList.add('fade-in');
    } else {
      app.classList.add('ready');
    }
    const pf = document.getElementById('dropoff-form'); if (pf) pf.addEventListener('submit', onDropoffSubmit);
    const sf = document.getElementById('staff-login-form'); if (sf) sf.addEventListener('submit', onStaffLoginSubmit);
    document.querySelectorAll('details.panel[data-key]').forEach(d=>{
      d.addEventListener('toggle', ()=>{ state.panelsOpen[d.dataset.key] = d.open; });
    });
  }

  /* ---------------------------- event delegation ---------------------------- */
  function popPlusOne(btn){
    const rect = btn.getBoundingClientRect();
    const el = document.createElement('span');
    el.className = 'pop';
    el.textContent = '+1';
    el.style.left = (rect.width/2 - 8) + 'px';
    el.style.top = '6px';
    btn.appendChild(el);
    setTimeout(()=>el.remove(), 720);
  }
  function bumpBasket(){
    const bar = document.getElementById('basket-bar');
    if (bar){ bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump'); }
  }
  function popQty(id){
    const el = document.getElementById('qn-'+id);
    if (el){ el.classList.remove('qty-pop'); void el.offsetWidth; el.classList.add('qty-pop'); }
  }

  async function onDropoffSubmit(e){
    e.preventDefault();
    const val = document.getElementById('dropoff-input').value.trim();
    const n = parseInt(val,10);
    if (!val || isNaN(n) || n<DROP_MIN || n>DROP_MAX){
      state.dropoffError = 'Enter a number between '+DROP_MIN+' and '+DROP_MAX+'.';
      render();
    } else {
      go('menu', { dropOff:n, dropoffError:null });
    }
  }

  async function onStaffLoginSubmit(e){
    e.preventDefault();
    const name = document.getElementById('staff-name-input').value.trim();
    const pin = document.getElementById('staff-pin-input').value.trim();
    if (!name || !pin){ state.staffLoginError = 'Enter your name and PIN.'; render(); return; }
    await staffLogin(name, pin);
  }

  document.addEventListener('change', async (e)=>{
    const el = e.target.closest('[data-field]');
    if (!el || !sb) return;
    const field = el.dataset.field, id = el.dataset.id;
    if (field==='name') await sb.from('menu_items').update({ name: el.value }).eq('id', id);
    if (field==='price') await sb.from('menu_items').update({ price: parseFloat(el.value)||0 }).eq('id', id);
    if (field==='toppings'){
      const list = el.value.split(',').map(t=>t.trim()).filter(Boolean);
      await sb.from('menu_items').update({ toppings: list.length ? list : null }).eq('id', id);
    }
    if (field==='topping-price'){
      const val = el.value.trim()==='' ? null : Math.max(0, parseFloat(el.value)||0);
      await sb.from('menu_items').update({ topping_price: val }).eq('id', id);
    }
    if (field==='prep-min' || field==='prep-sec'){
      const row = el.closest('.timing-row');
      const mm = Math.max(0, parseInt(row.querySelector('[data-field="prep-min"]').value, 10) || 0);
      const ss = Math.max(0, Math.min(59, parseInt(row.querySelector('[data-field="prep-sec"]').value, 10) || 0));
      const total = Math.max(15, Math.min(1200, mm*60 + ss));
      saveItemPrepSeconds(id, total);
    }
    if (field==='delivery-min' || field==='delivery-sec'){
      const row = el.closest('.timing-row');
      const mm = Math.max(0, parseInt(row.querySelector('[data-field="delivery-min"]').value, 10) || 0);
      const ss = Math.max(0, Math.min(59, parseInt(row.querySelector('[data-field="delivery-sec"]').value, 10) || 0));
      const totalSecs = Math.max(30, Math.min(1800, mm*60 + ss));
      saveDeliveryPointMinutes(Number(id), Math.round((totalSecs/60)*10)/10);
    }
  });

  document.addEventListener('input', (e)=>{
    if (e.target && e.target.id==='order-comment-input') state.orderComment = e.target.value;
  });

  document.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    switch(action){
      case 'go-landing': go('landing'); break;
      case 'go-dropoff': go('dropoff'); break;
      case 'go-menu': go('menu'); break;
      case 'go-basket': go('basket'); break;
      case 'go-status': go('status', btn.dataset.id ? { myOrderId: btn.dataset.id } : {}); break;
      case 'go-staff':
        if (state.staff && state.staffMode) go('staffBoard');
        else if (state.staff) go('staffMode');
        else go('staffLogin');
        break;
      case 'set-cat': state.activeCategory = btn.dataset.cat; render(); break;
      case 'cart-plus': {
        const item = menuItems.find(m=>m.id===btn.dataset.id);
        if (item && item.available){ addToCart(item); popQty(item.id); bumpBasket(); }
        break;
      }
      case 'cart-plus-raw':
        addToCart({ id:btn.dataset.id, name:btn.dataset.name, price:parseFloat(btn.dataset.price) });
        popQty(btn.dataset.id);
        break;
      case 'cart-plus-topping': {
        const base = menuItems.find(m=>m.id===btn.dataset.base);
        if (base && base.available){
          const topping = decodeURIComponent(btn.dataset.topping);
          if (addToppingToCart(base, topping)) popPlusOne(btn);
        }
        break;
      }
      case 'cart-minus': {
        const id = btn.dataset.id;
        const line = state.cart.find(i=>i.id===id);
        const row = btn.closest('.basket-line');
        if (line && line.qty===1 && row){
          row.classList.add('removing');
          setTimeout(()=>removeFromCart(id), 220);
        } else {
          removeFromCart(id);
          popQty(id);
        }
        break;
      }
      case 'place-order': placeOrder(); break;
      case 'new-order': removeTrackedOrderId(state.myOrderId); go('landing', { myOrderId:null }); break;
      case 'enable-order-notifs':
        if (window.Notification){
          if (state.notifyReady){
            // toggle off — this is our app's own opt-in flag, not the
            // browser's permission (that can only be revoked from the
            // browser's own site settings), so switching it off here just
            // stops us from using it.
            state.notifyReady = false;
            try{ sessionStorage.setItem('lh_notify_ready','0'); }catch(err){}
            render();
          } else if (Notification.permission === 'granted'){
            state.notifyReady = true;
            try{ sessionStorage.setItem('lh_notify_ready','1'); }catch(err){}
            subscribeToPush(state.myOrderId);
            render();
          } else {
            Notification.requestPermission().then(p=>{
              state.notifyReady = p==='granted';
              try{ sessionStorage.setItem('lh_notify_ready', state.notifyReady?'1':'0'); }catch(err){}
              if (state.notifyReady) subscribeToPush(state.myOrderId);
              render();
            });
          }
        }
        break;
      case 'enable-staff-notifs':
        if (window.Notification){
          if (state.staffAlertsOn && Notification.permission==='granted'){
            state.staffAlertsOn = false; try{ sessionStorage.setItem('lh_staff_alerts','0'); }catch(err){} render();
          } else if (Notification.permission === 'granted'){
            state.staffAlertsOn = true; try{ sessionStorage.setItem('lh_staff_alerts','1'); }catch(err){} render();
          } else {
            Notification.requestPermission().then(p=>{ state.staffAlertsOn = p==='granted'; try{ sessionStorage.setItem('lh_staff_alerts', state.staffAlertsOn?'1':'0'); }catch(err){} render(); });
          }
        }
        break;
      case 'set-staff-mode':
        state.staffMode = btn.dataset.mode;
        try{ sessionStorage.setItem('lh_staff_mode', state.staffMode); }catch(err){}
        await enterBoard();
        break;
      case 'staff-signout': staffSignOut(); break;
      case 'advance': setOrderStatus(btn.dataset.id, statusPatch(btn.dataset.to)); break;
      case 'toggle-shop-open': toggleShopOpen(); break;
      case 'move-menu-item': moveMenuItem(btn.dataset.id, btn.dataset.dir); break;
      case 'toggle-stock': {
        const id = btn.dataset.id, current = btn.dataset.current==='true';
        const item = menuItems.find(m=>m.id===id);
        if (item) item.available = !current;
        btn.classList.toggle('on', !current);
        btn.dataset.current = String(!current);
        toggleMenuItem(id, current);
        break;
      }
      case 'delete-menu-item': {
        const id = btn.dataset.id;
        const row = btn.closest('.menu-admin-row');
        if (row){
          row.classList.add('removing');
          setTimeout(()=>{ menuItems = menuItems.filter(m=>m.id!==id); render(); }, 220);
        } else {
          menuItems = menuItems.filter(m=>m.id!==id); render();
        }
        deleteMenuItem(id);
        break;
      }
      case 'add-new-category': state.newCategoryDraft = true; render(); break;
      case 'add-menu-item': {
        const name = document.getElementById('new-item-name').value.trim();
        const newCatInput = document.getElementById('new-item-category-new');
        const category = (newCatInput && newCatInput.value.trim()) || document.getElementById('new-item-category').value || 'Other';
        const price = document.getElementById('new-item-price').value;
        if (name){ state.newCategoryDraft = false; addMenuItem(name, category, price); }
        break;
      }
      case 'set-delivery-filter': state.deliveryFilter = btn.dataset.f; render(); break;
      case 'toggle-staff-active': {
        const id = btn.dataset.id, current = btn.dataset.current==='true';
        const s = staffList.find(x=>x.id===id);
        if (s) s.active = !current;
        btn.classList.toggle('on', !current);
        btn.dataset.current = String(!current);
        toggleStaffActive(id, current);
        break;
      }
      case 'delete-staff': deleteStaffAccount(btn.dataset.id, btn.dataset.name); break;
      case 'show-add-staff': state.addingStaff = true; state.addStaffError = null; render(); break;
      case 'cancel-add-staff': state.addingStaff = false; state.addStaffError = null; render(); break;
      case 'show-change-pin': state.pinAction = { id: btn.dataset.id, mode:'self' }; state.pinActionError = null; render(); break;
      case 'show-reset-pin': state.pinAction = { id: btn.dataset.id, mode:'admin' }; state.pinActionError = null; render(); break;
      case 'cancel-pin-action': state.pinAction = null; state.pinActionError = null; render(); break;
      case 'show-rename-staff': state.renameAction = { id: btn.dataset.id }; state.renameError = null; render(); break;
      case 'cancel-rename-staff': state.renameAction = null; state.renameError = null; render(); break;
      case 'submit-rename-staff': {
        const newName = document.getElementById('rename-staff-input').value.trim();
        renameStaffAccount(state.renameAction.id, newName);
        break;
      }
      case 'submit-change-pin': {
        const oldPin = document.getElementById('change-pin-old').value.trim();
        const newPin = document.getElementById('change-pin-new').value.trim();
        changeOwnPin(oldPin, newPin);
        break;
      }
      case 'submit-reset-pin': {
        const newPin = document.getElementById('reset-pin-new').value.trim();
        adminResetPin(state.pinAction.id, newPin);
        break;
      }
      case 'toggle-pin-visibility': {
        const input = document.getElementById(btn.dataset.target);
        if (input){
          const wasHidden = input.type === 'password';
          input.type = wasHidden ? 'text' : 'password';
          btn.innerHTML = wasHidden ? EYE_OFF : EYE_OPEN;
        }
        break;
      }
      case 'add-staff': {
        const name = document.getElementById('new-staff-name').value.trim();
        const pin = document.getElementById('new-staff-pin').value.trim();
        if (!name || !pin){ state.addStaffError = 'Enter a name and PIN for your new teammate.'; render(); break; }
        addStaffAccount(name, pin);
        break;
      }
      case 'view-order': state.viewingOrderId = btn.dataset.id; render(); break;
      case 'close-order-modal': state.viewingOrderId = null; render(); break;
      case 'noop': break;
      case 'save-timing-settings': {
        const bufferInput = document.getElementById('admin-buffer-input');
        const roundInput = document.getElementById('round-to-input');
        const toppingSecInput = document.getElementById('topping-prep-input');
        saveTimingSettings(bufferInput ? bufferInput.value : null, roundInput ? roundInput.value : null, toppingSecInput ? toppingSecInput.value : null);
        break;
      }
    }
  });

  /* ---------------------------- ticking countdown ---------------------------- */
  setInterval(()=>{
    if (state.view==='status'){
      const order = orders.find(o=>o.id===state.myOrderId);
      if (order && ['received','preparing','ready','delivering'].includes(order.status)){
        const info = etaInfo(order);
        const tb = timerBlock(order, info);
        const el = document.getElementById('lh-timer');
        if (el){ el.textContent = tb.big; el.classList.toggle('late', info.mode==='late'); }
        const capEl = document.getElementById('lh-timer-caption');
        if (capEl){ capEl.textContent = tb.caption; capEl.classList.toggle('late', info.mode==='late'); }
      }
    }
    if (state.view==='staffBoard'){
      orders.filter(o=>['received','preparing','ready','delivering'].includes(o.status)).forEach(o=>{
        const el = document.getElementById('dtimer-'+o.id);
        if (el){
          const info = etaInfo(o);
          el.textContent = timerBlock(o, info).big;
          el.classList.toggle('late', info.mode==='late');
        }
      });
    }
  }, 1000);

  /* ---------------------------- boot ---------------------------- */
  // PWA plumbing: iOS only delivers push to an app added to the Home Screen,
  // and that needs a manifest plus the apple-specific meta tags.
  function installPwaTags(){
    try{
      if (!document.querySelector('link[rel="manifest"]')){
        const link = document.createElement('link');
        link.rel = 'manifest'; link.href = 'manifest.json';
        document.head.appendChild(link);
      }
      const metas = [
        ['apple-mobile-web-app-capable','yes'],
        ['apple-mobile-web-app-status-bar-style','black-translucent'],
        ['apple-mobile-web-app-title','Little Hatch'],
        ['mobile-web-app-capable','yes'],
        ['theme-color','#17130f']
      ];
      metas.forEach(([name,content])=>{
        if (!document.querySelector('meta[name="'+name+'"]')){
          const m = document.createElement('meta');
          m.name = name; m.content = content;
          document.head.appendChild(m);
        }
      });
      if (!document.querySelector('link[rel="apple-touch-icon"]')){
        const icon = document.createElement('link');
        icon.rel = 'apple-touch-icon'; icon.href = FAVICON_ICON;
        document.head.appendChild(icon);
      }
    }catch(e){}
  }
  installPwaTags();
  ensureServiceWorker();

  // Branded splash while we connect to the database, so the first paint isn't
  // a half-empty menu. Removed as soon as the first real data lands.
  function showBootSplash(){
    if (document.getElementById('lh-boot')) return;
    const el = document.createElement('div');
    el.id = 'lh-boot';
    el.innerHTML =
      '<img src="'+LOGO_BLACK+'" alt="The Little Hatch" class="lh-boot-logo">' +
      '<div class="lh-boot-steam"><span></span><span></span><span></span></div>' +
      '<div class="lh-boot-word">warming up</div>';
    document.body.appendChild(el);
  }
  function hideBootSplash(){
    const el = document.getElementById('lh-boot');
    if (!el) return;
    el.classList.add('gone');
    setTimeout(()=>{ el.remove(); }, 420);
  }
  window.__lhHideBoot = hideBootSplash;
  showBootSplash();
  // Never let the splash trap someone if the network is having a bad day.
  setTimeout(hideBootSplash, 6000);

  // The staff board lives on its own quiet URL rather than a link on the
  // landing page. The PIN is still what actually guards it.
  const lhPath = location.pathname.toLowerCase();
  if (location.hash === '#staff' || lhPath.indexOf('staff-for-the-hatch') !== -1){
    state.view = 'staffLogin';
  }
  render(true);
  initSupabase();

</script>
